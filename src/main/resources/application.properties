spring.application.name=JavaProjetS7

spring.datasource.url=jdbc:mysql://localhost:3306/gestion_transport?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mvc.hiddenmethod.filter.enabled=true

spring.web.error.include-message=always
spring.jpa.hibernate.ddl-auto = none
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./script_creation_BDD.sql
spring.sql.init.data-locations=file:./script_insertion_BDD.sql
spring.config.import=optional:file:.env[.properties]
